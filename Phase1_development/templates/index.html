<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Phishing Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">
                <i class="fas fa-shield-alt"></i> Email Phishing Detector
            </span>
            <span class="navbar-text text-light">
                <small id="model-status" class="badge bg-success">Model Ready</small>
            </span>
        </div>
    </nav>

    <div class="container-fluid py-5">
        <div class="row">
            <div class="col-lg-8 mx-auto">

                <!-- Upload Section -->
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">
                            <i class="fas fa-upload"></i> Upload Email for Analysis
                        </h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="emailFile" class="form-label">Select email file (.eml or .msg)</label>
                            <input class="form-control form-control-lg" type="file" id="emailFile"
                                   accept=".eml,.msg" aria-label="Email file input">
                            <small class="text-muted">Maximum file size: 16MB</small>
                        </div>

                        <div id="manualInput" class="mb-3">
                            <button class="btn btn-link btn-sm" type="button" id="toggleManual">
                                Or analyze email text directly
                            </button>
                            <div id="manualForm" style="display: none;" class="mt-3 p-3 bg-light rounded">
                                <div class="mb-2">
                                    <input type="email" class="form-control form-control-sm" id="manualSender"
                                           placeholder="From (email address)">
                                </div>
                                <div class="mb-2">
                                    <input type="text" class="form-control form-control-sm" id="manualSubject"
                                           placeholder="Subject">
                                </div>
                                <div class="mb-2">
                                    <textarea class="form-control form-control-sm" id="manualBody" rows="4"
                                              placeholder="Email body text"></textarea>
                                </div>
                                <button class="btn btn-sm btn-primary" id="analyzeTextBtn">Analyze Text</button>
                                <button class="btn btn-sm btn-secondary" id="cancelTextBtn">Cancel</button>
                            </div>
                        </div>

                        <button class="btn btn-primary btn-lg w-100" id="analyzeBtn">
                            <i class="fas fa-search"></i> Analyze Email
                        </button>
                    </div>
                </div>

                <!-- Loading Indicator -->
                <div id="loadingSection" style="display:none;" class="text-center mb-4">
                    <div class="spinner-border text-primary" role="status">
                        <span class="visually-hidden">Analyzing...</span>
                    </div>
                    <p class="mt-3">Analyzing email...</p>
                </div>

                <!-- Results Section -->
                <div id="resultsSection" style="display:none;">

                    <!-- Classification Result -->
                    <div class="card shadow-sm mb-4" id="classificationCard">
                        <div class="card-body text-center py-5">
                            <h2 id="classificationBadge" class="badge" style="font-size: 2rem;"></h2>
                            <p class="mt-3 fs-5" id="confidenceText"></p>
                            <div id="confidenceBar" class="mt-3">
                                <div class="progress" style="height: 25px;">
                                    <div id="confidenceBarFill" class="progress-bar" role="progressbar"
                                         style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                                        <span id="confidencePercent">0%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Email Info -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-envelope"></i> Email Information
                            </h5>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <strong>From:</strong>
                                    <p id="emailFrom" class="text-break"></p>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <strong>Domain:</strong>
                                    <p id="emailDomain"></p>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12 mb-3">
                                    <strong>Subject:</strong>
                                    <p id="emailSubject" class="text-break"></p>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12">
                                    <strong>To:</strong>
                                    <p id="emailTo" class="text-break"></p>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Threat Indicators -->
                    <div class="card shadow-sm mb-4" id="threatCard" style="display:none;">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-exclamation-triangle"></i> Threat Indicators
                            </h5>
                        </div>
                        <div class="card-body" id="threatList">
                            <!-- Threat indicators will be inserted here -->
                        </div>
                    </div>

                    <!-- Recommendation -->
                    <div class="card shadow-sm mb-4">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-lightbulb"></i> Recommendation
                            </h5>
                        </div>
                        <div class="card-body">
                            <div id="recommendation" class="alert"></div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="mb-4">
                        <button class="btn btn-primary w-100 mb-2" id="analyzeAnotherBtn">
                            <i class="fas fa-plus"></i> Analyze Another Email
                        </button>
                    </div>

                </div>

                <!-- Error Section -->
                <div id="errorSection" style="display:none;" class="alert alert-danger" role="alert">
                    <h4 class="alert-heading">
                        <i class="fas fa-exclamation-circle"></i> Error
                    </h4>
                    <p id="errorMessage"></p>
                </div>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark text-light text-center py-4 mt-5">
        <p class="mb-0">
            Phishing Email Detection Tool |
            <small>FYP - De Montfort University Cybersecurity</small>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
